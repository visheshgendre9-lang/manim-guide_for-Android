def load_speaker_metadata(model_path):
    speaker_map = {}
    cfg_json = os.path.join(model_path, "config.json")
    if os.path.exists(cfg_json):
        try:
            with open(cfg_json, "r", encoding="utf-8") as f:
                data = json.load(f)
                if "speaker_id_map" in data and isinstance(data["speaker_id_map"], dict):
                    for name, sid in data["speaker_id_map"].items():
                        speaker_map[int(sid)] = f"Speaker '{name}'"
                elif "speakers" in data and isinstance(data["speakers"], list):
                    for sid, name in enumerate(data["speakers"]):
                        speaker_map[sid] = f"Speaker '{name}'"
        except Exception:
            pass

    spk_txt = os.path.join(model_path, "speakers.txt")
    if os.path.exists(spk_txt):
        try:
            with open(spk_txt, "r", encoding="utf-8") as f:
                for idx, line in enumerate(f):
                    line_str = line.strip()
                    if line_str:
                        speaker_map[idx] = f"Speaker '{line_str}'"
        except Exception:
            pass

    return speaker_map

def scan_text_files():
    """Scans the script directory for .txt files."""
    text_dir = SCRIPT_DIR
    if os.path.exists(text_dir):
        files = [f for f in os.listdir(text_dir) if f.endswith(".txt")]
        return sorted(files)
    return []

def main_pipeline():
    console.clear()
    render_banner()

    # Step 1: Detect Models inside models/ directory
    if not os.path.exists(MODELS_DIR):
        console.print(f"[bold red]✗ Error:[/bold red] Models directory not found at '[bold white]{MODELS_DIR}[/bold white]'.", style="red")
        sys.exit(1)

    available_models = [
        d for d in os.listdir(MODELS_DIR)
        if os.path.isdir(os.path.join(MODELS_DIR, d))
    ]

    if not available_models:
        console.print(f"[bold red]✗ Error:[/bold red] No model subdirectories detected inside '{MODELS_DIR}'!", style="red")
        sys.exit(1)

    default_model_index = 1
    if CONFIG_MODEL_DIR:
        config_folder_name = os.path.basename(os.path.normpath(CONFIG_MODEL_DIR))
        if config_folder_name in available_models:
            default_model_index = available_models.index(config_folder_name) + 1

    table = Table(title="[bold bright_white]1. Select Active Model[/bold bright_white]", box=box.ROUNDED, border_style="bright_blue")
    table.add_column("ID", style="bold bright_cyan", justify="center")
    table.add_column("Model Identifier", style="bold white")
    table.add_column("Status", style="bright_green")

    for idx, model_folder in enumerate(available_models, start=1):
        status = "[bold green]Active Default[/bold green]" if idx == default_model_index else "Ready"
        table.add_row(str(idx), model_folder, status)

    console.print(table)

    model_choice = Prompt.ask("\\n[bold cyan]?[/bold cyan] Choose Model", default=str(default_model_index))
    try:
        selected_model_folder = available_models[int(model_choice) - 1]
    except (ValueError, IndexError):
        selected_model_folder = available_models[default_model_index - 1]

    selected_model_path = os.path.join(MODELS_DIR, selected_model_folder)

    # Step 2: Input Mode Selection & TXT File Scanner
    console.print("\\n[bold bright_white]2. Input Source[/bold bright_white]")
    console.print(" [1] Terminal Text Prompt")
    console.print(" [2] Script File (.txt Scanner)")

    input_mode = Prompt.ask("\\n[bold cyan]?[/bold cyan] Select Mode", choices=["1", "2"], default="1")

    paragraphs = []
    if input_mode == "2":
        detected_files = scan_text_files()

        if detected_files:
            file_table = Table(title="[bold bright_white]Detected Script Files (.txt)[/bold bright_white]", box=box.ROUNDED, border_style="bright_magenta")
            file_table.add_column("ID", style="bold magenta", justify="center")
            file_table.add_column("Filename", style="bold white")
            file_table.add_column("Location", style="dim")

            for f_idx, fname in enumerate(detected_files, start=1):
                file_table.add_row(str(f_idx), fname, f"{SCRIPT_DIR}/{fname}")

            console.print(file_table)

            file_choice = Prompt.ask("\\n[bold cyan]?[/bold cyan] Select File ID or type full path", default="1")

            try:
                selected_txt = detected_files[int(file_choice) - 1]
                text_file_path = os.path.join(SCRIPT_DIR, selected_txt)
            except (ValueError, IndexError):
                text_file_path = file_choice if os.path.isabs(file_choice) else os.path.join(SCRIPT_DIR, file_choice)
                if not text_file_path.endswith(".txt"):
                    text_file_path += ".txt"
        else:
            console.print("[yellow]![/yellow] No .txt files automatically detected. Enter full file path manually:")
            manual_file = Prompt.ask("Path to .txt file").strip()
            text_file_path = manual_file if os.path.isabs(manual_file) else os.path.join(SCRIPT_DIR, manual_file)
            if not text_file_path.endswith(".txt"):
                text_file_path += ".txt"

        if os.path.exists(text_file_path):
            with open(text_file_path, "r", encoding="utf-8") as f:
                raw_story = f.read().strip()
            paragraphs = [p.strip() for p in raw_story.split("\\n") if p.strip()]
            console.print(f"[bold green]✓[/bold green] Loaded '[bold white]{os.path.basename(text_file_path)}[/bold white]' ({len(paragraphs)} paragraphs).")
        else:
            console.print(f"[bold red]✗[/bold red] File not found at '{text_file_path}'. Falling back to prompt input.")
            input_mode = "1"

    if input_mode != "2" or not paragraphs:
        text_input = Prompt.ask("\\n[bold cyan]?[/bold cyan] Enter Text to Synthesize").strip()
        if not text_input:
            text_input = "In this video, we will solve a challenging definite integral step by step."
        paragraphs = [text_input]

    # Step 3: Speaker Selection
    is_kokoro_multi = "multi" in selected_model_folder.lower()
    is_kokoro_en = "kokoro" in selected_model_folder.lower() and not is_kokoro_multi

    if is_kokoro_multi:
        speaker_map = KOKORO_MULTI_SPEAKERS
    elif is_kokoro_en:
        speaker_map = KOKORO_EN_SPEAKERS
    else:
        speaker_map = load_speaker_metadata(selected_model_path)

    spk_table = Table(title=f"[bold bright_white]3. Speaker Profiles ({selected_model_folder})[/bold bright_white]", box=box.ROUNDED, border_style="bright_blue")
    spk_table.add_column("SID", style="bold bright_cyan", justify="center")
    spk_table.add_column("Speaker Profile / Language", style="bold white")

    if speaker_map:
        for sid_key, desc in list(sorted(speaker_map.items()))[:20]:
            spk_table.add_row(str(sid_key), desc)
        console.print(spk_table)
        if len(speaker_map) > 20:
            console.print(f"[dim]... {len(speaker_map) - 20} additional SIDs available.[/dim]")
    else:
        console.print("[yellow]Numeric Speaker Model. Enter any valid integer SID (e.g. 0 to 900).[/yellow]")

    sid_input = Prompt.ask("\\n[bold cyan]?[/bold cyan] Select Speaker ID", default=str(DEFAULT_SID))
    try:
        sid = int(sid_input)
    except ValueError:
        sid = DEFAULT_SID

    speaker_label = speaker_map.get(sid, f"Speaker ID {sid}")

    # Step 4: Speed Factor
    speed_input = Prompt.ask("\\n[bold cyan]?[/bold cyan] Speaking Speed (1.0 = Normal, 1.25 = Fast, 0.85 = Slow)", default=str(DEFAULT_SPEED))
    try:
        current_speed = float(speed_input)
    except ValueError:
        current_speed = DEFAULT_SPEED

    # Step 5: Output Filename
    filename = Prompt.ask("\\n[bold cyan]?[/bold cyan] Output Filename", default="voiceover.wav")
    if not filename.endswith(".wav"):
        filename += ".wav"

    output_path = os.path.join(DEFAULT_OUTPUT_DIR, filename)

    # Configuration Summary Card
    console.clear()
    render_banner()

    summary_grid = Table.grid(expand=True)
    summary_grid.add_column(style="bold white", width=18)
    summary_grid.add_column(style="bright_cyan")

    summary_grid.add_row("Engine Model:", selected_model_folder)
    summary_grid.add_row("Voice Profile:", f"SID {sid} ({speaker_label})")
    summary_grid.add_row("Speech Speed:", f"{current_speed}x")
    summary_grid.add_row("Paragraphs:", f"{len(paragraphs)} paragraph(s)")
    summary_grid.add_row("Save Destination:", output_path)

    console.print(Panel(summary_grid, title="[bold bright_white]Render Pipeline Configuration[/bold bright_white]", border_style="bright_blue", box=box.ROUNDED))

    # Synthesis Execution
    with Progress(
        SpinnerColumn("dots", style="bold bright_cyan"),
        TextColumn("[bold bright_white]{task.description}[/bold bright_white]"),
        BarColumn(bar_width=None, complete_style="bright_cyan", finished_style="bright_green"),
        TaskProgressColumn(),
        console=console
    ) as progress:

        init_task = progress.add_task("Initializing Model...", total=100)

        if is_kokoro_en or is_kokoro_multi:
            lexicon_file = os.path.join(selected_model_path, "lexicon.txt")
            selected_lang = "en-us"
            if is_kokoro_multi:
                if sid in [29, 30, 31]:
                    selected_lang = "hi"
                elif sid in [32, 33, 34, 35, 36]:
                    selected_lang = "ja"

            kokoro_config = sherpa_onnx.OfflineTtsKokoroModelConfig(
                model=os.path.join(selected_model_path, "model.onnx"),
                voices=os.path.join(selected_model_path, "voices.bin"),
                tokens=os.path.join(selected_model_path, "tokens.txt"),
                data_dir=os.path.join(selected_model_path, "espeak-ng-data"),
                lexicon=lexicon_file if os.path.exists(lexicon_file) else "",
                length_scale=1.0,
            )
            if hasattr(kokoro_config, "lang"):
                kokoro_config.lang = selected_lang

            config = sherpa_onnx.OfflineTtsConfig(
                model=sherpa_onnx.OfflineTtsModelConfig(
                    kokoro=kokoro_config,
                    num_threads=DEFAULT_THREADS,
                )
            )
        else:
            onnx_file = next((f for f in os.listdir(selected_model_path) if f.endswith(".onnx")), "model.onnx")
            config = sherpa_onnx.OfflineTtsConfig(
                model=sherner_onnx.OfflineTtsModelConfig(
                    vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                        model=os.path.join(selected_model_path, onnx_file),
                        tokens=os.path.join(selected_model_path, "tokens.txt"),
                        data_dir=os.path.join(selected_model_path, "espeak-ng-data") if os.path.exists(os.path.join(selected_model_path, "espeak-ng-data")) else "",
                    ),
                    num_threads=DEFAULT_THREADS,
                )
            )

        tts = sherpa_onnx.OfflineTts(config)
        progress.update(init_task, completed=100)

        audio_chunks = []
        sample_rate = None

        render_task = progress.add_task("Synthesizing Audio...", total=len(paragraphs))

        for idx, p in enumerate(paragraphs, start=1):
            audio = tts.generate(text=p, sid=sid, speed=current_speed)

            if sample_rate is None:
                sample_rate = audio.sample_rate

            audio_chunks.append(audio.samples)
            silence = np.zeros(int(sample_rate * 0.5), dtype=np.float32)
            audio_chunks.append(silence)

            progress.update(render_task, completed=idx)

        combined_audio = np.concatenate(audio_chunks)
        sf.write(output_path, combined_audio, sample_rate)

    console.print(Panel(
        f"[bold bright_green]✓ GENERATION COMPLETE[/bold bright_green]\\n"
        f"[dim]Output file saved directly to:[/dim]\\n"
        f"[bold white]{output_path}[/bold white]",
        border_style="bright_green",
        box=box.ROUNDED
    ))

if __name__ == "__main__":
    while True:
        main_pipeline()
        again = Prompt.ask("\\n[bold cyan]?[/bold cyan] Run another generation?", choices=["y", "n"], default="y")
        if again.lower() != "y":
            console.print("\\n[bold bright_cyan]Session ended. Goodbye![/bold bright_cyan]\\n")
            break

echo ""; echo "========================================";
echo "  MANIM INSTALLATION — SPACE BREAKDOWN";
echo "========================================";
echo "  Ubuntu base already installed: ~200 MB";
echo "  FFmpeg:                        ~150 MB";
echo "  LaTeX (texlive):               ~800 MB";
echo "  Cairo + Pango:                 ~100 MB";
echo "  Python + pip + venv:           ~100 MB";
echo "  Manim + dependencies:          ~300 MB";
echo "  Build overhead & cache:        ~1.9 GB";
echo "----------------------------------------";
echo "  TOTAL REQUIRED:               ~3.5 GB";
echo "========================================";
echo "";
read -p "Proceed with installation? (y/n): " confirm;
if [ "$confirm" != "y" ]; then echo "Aborted."; exit 1; fi;
apt update -y && apt upgrade -y &&
apt install -y python3 python3-pip python3-venv python3-dev ffmpeg texlive texlive-latex-extra texlive-fonts-recommended cm-super dvipng libcairo2-dev libpango1.0-dev pkg-config &&
mkdir -p ~/manim-projects && cd ~/manim-projects &&
python3 -m venv manim-env &&
source manim-env/bin/activate &&
pip install --upgrade pip &&
pip install manim &&
echo "" &&
echo "✅ Manim installed successfully!" &&
echo "   Run: proot-distro login ubuntu" &&
echo "   Then: cd ~/manim-projects && source manim-env/bin/activate" &&
echo "   Then: manim --version"
'`,notes:'Make sure you have at least 4 GB free on your device before running this. Keep your screen on and Termux in the foreground (takes 10-20 minutes). When prompted, type "y" and press Enter.',tableData:null},{title:"Quick Session Alias (Optional)",content:"Add this to ~/.bashrc inside Ubuntu so you can just type manimgo to enter your environment instantly:",code:`alias manimgo="cd ~/manim-projects && source manim-env/bin/activate"
source ~/.bashrc`,notes:"Typing manimgo in Termux will instantly drop you into your project folder with the virtual environment activated!",tableData:null}]},{id:"chapter-3",chapterNumber:"03",title:"03 Making an Animation (Every Time)",summary:"The daily iterative workflow: single-command container entry, drafting in 480p, rendering in 1080p60, and exporting to Android storage.",steps:[{title:"Single Command to Enter & Activate (Fastest Way)",content:"This single command logs into Ubuntu, moves into your project folder, and activates Manim automatically. You'll see (manim-env) appear at the start of your prompt — you're ready to create your file.",code:'proot-distro login ubuntu --shared-tmp -- bash -c "cd ~/manim-projects && source manim-env/bin/activate && bash"',notes:"Paste this in Termux anytime to start working on animations immediately.",tableData:null},{title:"Step 1 — Open Termux & Enter Ubuntu",content:"proot-distro login ubuntu Your prompt changes to root@localhost:~# . You are now inside Ubuntu.",code:"proot-distro login ubuntu",notes:null,tableData:null},{title:"Step 2 — Go to Your Project Folder & Activate Manim",content:"cd ~/manim-projects source manim-env/bin/activate You'll see (manim-env) appear at the start of your prompt. Manim is now ready.",code:`cd ~/manim-projects
source manim-env/bin/activate`,notes:null,tableData:null},{title:"Step 3 — Create or Edit Your Animation File (Part 1)",content:'Create a new file or edit an existing one using nano: nano my_animation.py Write your animation inside. Here is a full example with the most common elements: from manim import * class MyScene (Scene): def construct (self): # ── Text ────────────────────────────────── title = Text( "Hello, Manim!" , font_size= 48 ) self.play(Write(title)) self.wait( 1 ) self.play(FadeOut(title)) # ── Shapes ──────────────────────────────── circle = Circle(radius= 1.5 , color=BLUE) square = Square(side_length= 2 , color=RED) square.next_to(circle, RIGHT, buff= 0.5 ) self.play(Create(circle), Create(square)) self.wait( 1 ) # ── Move a shape ────────────────────────── self.play(circle.animate.shift(UP * 2 )) self.wait( 0.5 ) # ── Change color ────────────────────────── self.play(circle.animate.set_color(GREEN)) self.wait( 0.5 ) # ── Math equation ───────────────────────── eq = MathTex(r "e^{i\\pi} + 1 = 0" , font_size= 56 ) self.play(FadeOut(circle), FadeOut(square)) self.play(Write(eq)) self.wait( 2 ) # ── End ─────────────────────────────────── self.play(FadeOut(eq)) When done writing, save and exit nano: press Ctrl+X → Y → Enter .',code:"nano my_animation.py",notes:'ℹ️ Common things you can use: Text("...") — plain text | MathTex(r"...") — math equations Circle() Square() Triangle() Arrow() Line() — shapes Write() — draw text/equations | Create() — draw shapes FadeIn() FadeOut() — appear/disappear .animate.shift() .animate.scale() .animate.rotate() — move/transform self.wait(1) — pause for 1 second',tableData:null},{title:"Step 3 — Create or Edit Your Animation File (Part 2)",content:null,code:`from manim import *

class MyScene(Scene):
    def construct(self):

        # ── Text ──────────────────────────────────
        title = Text("Hello, Manim!", font_size=48)
        self.play(Write(title))
        self.wait(1)
        self.play(FadeOut(title))

        # ── Shapes ────────────────────────────────
        circle = Circle(radius=1.5, color=BLUE)
        square = Square(side_length=2, color=RED)
        square.next_to(circle, RIGHT, buff=0.5)

        self.play(Create(circle), Create(square))
        self.wait(1)

        # ── Move a shape ──────────────────────────
        self.play(circle.animate.shift(UP * 2))
        self.wait(0.5)

        # ── Change color ──────────────────────────
        self.play(circle.animate.set_color(GREEN))
        self.wait(0.5)

        # ── Math equation ─────────────────────────
        eq = MathTex(r"e^{i\\pi} + 1 = 0", font_size=56)
        self.play(FadeOut(circle), FadeOut(square))
        self.play(Write(eq))
        self.wait(2)

        # ── End ───────────────────────────────────
        self.play(FadeOut(eq))`,notes:null,tableData:null},{title:"Step 4 — Render the Animation",content:"Choose a quality level. Always start with low quality to test, then switch to high for the final version.",code:`# Low quality — 480p, fastest (use for testing)
manim -ql my_animation.py MyScene

# Medium quality — 720p
manim -qm my_animation.py MyScene

# High quality — 1080p (slow, use for final render)
manim -qh my_animation.py MyScene

# 4K quality — 2160p (very slow, only for powerful devices)
manim -qk my_animation.py MyScene`,notes:"⚠️ Replace MyScene with whatever you named your class. In the example above it's MyScene . It must match exactly.",tableData:null},{title:"Step 5 — Find & Copy the Output Video",content:"After rendering, Manim saves the video here: # Low quality output path ~/manim-projects/media/videos/my_animation/480p15/MyScene.mp4 # Copy to Downloads so VLC can open it cp ~/manim-projects/media/videos/my_animation/480p15/MyScene.mp4 /sdcard/Download/ Open VLC on your tablet → tap Browse → Downloads → tap the file.",code:`# Low quality output path
~/manim-projects/media/videos/my_animation/480p15/MyScene.mp4

# Copy to Downloads so VLC can open it
cp ~/manim-projects/media/videos/my_animation/480p15/MyScene.mp4 /sdcard/Download/`,notes:null,tableData:null},{title:"Step 6 — Making Another Animation",content:"Just repeat from Step 3. Create a new .py file with a new class name, or add a new class to the same file and render it by name.",code:null,notes:"🚀 Quick session summary every time: 1. Open Termux → proot-distro login ubuntu 2. cd ~/manim-projects && source manim-env/bin/activate 3. nano filename.py — write your scene 4. manim -ql filename.py ClassName — render 5. cp media/videos/.../MyScene.mp4 /sdcard/Download/ — copy to VLC",tableData:null}]},{id:"chapter-4",chapterNumber:"04",title:"05 Manim Settings & Configuration",summary:"Configuration management via manim.cfg presets (16:9 Landscape & 9:16 Shorts) and CLI override flags.",steps:[{title:"Method A — Config File (Recommended) (Part 1)",content:"Create a file called manim.cfg inside your project folder. Manim reads it automatically every time you render. nano ~/manim-projects/manim.cfg Paste this full config, edit the values you want, then save with Ctrl+X → Y → Enter :",code:"nano ~/manim-projects/manim.cfg",notes:null,tableData:null},{title:"Method A — Config File (Recommended) (Part 2)",content:null,code:`[CLI]

# ── Quality & Resolution ──────────────────
# Options: low_quality, medium_quality, high_quality, production_quality
quality = low_quality

# Custom resolution (overrides quality preset)
# pixel_width = 1920
# pixel_height = 1080

# Frames per second
# 15 = low, 30 = standard, 60 = smooth, 120 = ultra smooth
frame_rate = 30

# ── Output ────────────────────────────────
# Folder where videos are saved
media_dir = ./media

# Output file format: mp4, gif, webm, png (png saves every frame as image)
format = mp4

# Save last frame as image (yes/no)
save_last_frame = False

# Save every frame as PNG (warning: creates hundreds of files)
save_pngs = False

# ── Background ────────────────────────────
# Color name or hex code e.g. WHITE, BLACK, #1a1a2e
background_color = BLACK

# Background opacity (0 = transparent, 1 = solid)
# Use with format=webm for transparent background
background_opacity = 1.0

# ── Preview ───────────────────────────────
# Auto open video after rendering (needs X11)
preview = False

# ── Performance ───────────────────────────
# Disable caching (set True to always re-render from scratch)
disable_caching = False

# ── Text & Fonts ──────────────────────────
# Default font for Text() objects
# font =

# ── Scene ─────────────────────────────────
# Start rendering from this second (skip beginning)
# start_at_animation_number = 0

# Render only up to this animation number
# end_at_animation_number =`,notes:null,tableData:null},{title:"Method B — Command Line Flags (Quick Override)",content:"Add flags directly to your render command without editing any file. These override the config file.",code:`# Quality presets
manim -ql file.py Scene   # 480p  15fps — fastest
manim -qm file.py Scene   # 720p  30fps
manim -qh file.py Scene   # 1080p 60fps
manim -qp file.py Scene   # 1440p 60fps — production
manim -qk file.py Scene   # 2160p 60fps — 4K (very slow)

# Custom resolution & FPS
manim -ql --resolution 1280,720 --frame_rate 60 file.py Scene

# Background color
manim -ql --background_color WHITE file.py Scene
manim -ql --background_color "#1a1a2e" file.py Scene

# Save as GIF instead of MP4
manim -ql --format gif file.py Scene

# Save last frame as PNG image
manim -ql --save_last_frame file.py Scene

# Transparent background (saves as webm)
manim -ql --format webm --background_opacity 0 file.py Scene

# Skip to a specific animation number
manim -ql -n 3 file.py Scene

# Render only animations 3 to 7
manim -ql -n 3,7 file.py Scene

# Disable cache (force full re-render)
manim -ql --disable_caching file.py Scene

# Preview after render (needs Termux:X11)
manim -ql -p file.py Scene`,notes:null,tableData:null},{title:"All Settings at a Glance",content:null,code:null,notes:"💡 For your tablet, the best balance is 720p at 30fps — good quality without being too slow to render. Use manim -qm file.py Scene or set quality = medium_quality in your config.",tableData:{headers:["Setting","What it does","Default"],rows:[["quality","Resolution + FPS preset","low_quality"],["frame_rate","Frames per second of the video","15 (low), 30 (med), 60 (high)"],["pixel_width / pixel_height","Custom resolution in pixels","854×480 (low)"],["background_color","Background color (name or hex)","BLACK"],["background_opacity","0 = transparent, 1 = solid","1.0"],["format","Output format: mp4, gif, webm, png","mp4"],["save_last_frame","Save final frame as a PNG image","False"],["save_pngs","Save every frame as PNG","False"],["media_dir","Folder where output is saved","./media"],["preview","Auto open after render (needs X11)","False"],["disable_caching","Always re-render from scratch","False"],["-n 3,7","Render only animations 3 to 7","All"]]}}]},{id:"chapter-5",chapterNumber:"05",title:"04 Live Preview with Termux:X11",summary:"Windowed live rendering workflow using Termux:X11 and XFCE without leaving the terminal.",steps:[{title:"Step 1 — Install X11 Package Inside Termux",content:"Run this in Termux (not inside Ubuntu):",code:`pkg install x11-repo -y
pkg install termux-x11-nightly -y`,notes:null,tableData:null},{title:"Step 2 — Open the Termux:X11 App",content:null,code:null,notes:null,tableData:null},{title:"Step 3 — Login to Ubuntu with Shared Temp",content:"This time you must login to Ubuntu with an extra flag --shared-tmp — without this, X11 will not connect.",code:"proot-distro login ubuntu --shared-tmp",notes:null,tableData:null},{title:"Step 4 — Install XFCE Desktop (First Time Only)",content:"XFCE is a lightweight desktop environment. You only need to install this once.",code:"apt install -y xfce4 xfce4-terminal dbus-x11",notes:null,tableData:null},{title:"Step 5 — Start the X11 Session",content:'termux-x11 :1 -xstartup "dbus-launch --exit-with-session xfce4-session" & Now switch to the Termux:X11 app — you should see the XFCE desktop appear. Switch back to Termux to continue.',code:'termux-x11 :1 -xstartup "dbus-launch --exit-with-session xfce4-session" &',notes:'⚠️ If you see a black screen with only a cursor , go back to Ubuntu and add the -legacy-drawing flag: termux-x11 :1 -legacy-drawing -xstartup "dbus-launch --exit-with-session xfce4-session" &',tableData:null},{title:"Step 6 — Set Display & Activate Manim",content:null,code:`export DISPLAY=:1
cd ~/manim-projects
source manim-env/bin/activate`,notes:null,tableData:null},{title:"Step 7 — Render with Live Preview",content:"Add the -p flag to your render command. This opens the animation live in Termux:X11 as soon as it finishes rendering. # -p means preview — opens video automatically in X11 manim -ql -p my_animation.py MyScene Switch to the Termux:X11 app — your animation will play automatically.",code:`# -p means preview — opens video automatically in X11
manim -ql -p my_animation.py MyScene`,notes:null,tableData:null},{title:"Step 8 — Stopping X11",content:"When done, exit the X11 session cleanly:",code:"pkill -f termux-x11",notes:'🖥️ X11 session summary every time: 1. Open Termux:X11 app first 2. In Termux: proot-distro login ubuntu --shared-tmp 3. termux-x11 :1 -xstartup "dbus-launch --exit-with-session xfce4-session" & 4. export DISPLAY=:1 5. cd ~/manim-projects && source manim-env/bin/activate 6. manim -ql -p filename.py ClassName 7. Switch to Termux:X11 app to watch',tableData:null}]},{id:"chapter-6",chapterNumber:"06",title:"06 Writing a Manim Code",summary:"The exhaustive developer library: Boilerplate, Shapes, Colors, MathTex formulas, Transforms, Positioning, .shift(), Matrices, 2D/3D Graphs, and Animations.",steps:[{title:"The Boilerplate (Every Scene Needs This)",content:"This is the skeleton of every Manim file you will ever write. Practice typing this out from memory until it's automatic.",code:`from manim import *

class MyScene(Scene):
    def construct(self):
        # everything happens in here
        # 1. create objects
        # 2. self.play(...) to animate them
        # 3. self.wait(...) to pause
        pass`,notes:"ℹ️ Render this with manim -ql filename.py MyScene — the class name at the end must match exactly (case-sensitive).",tableData:null},{title:"Minimal Working Example",content:null,code:`from manim import *

class MyScene(Scene):
    def construct(self):
        circle = Circle()
        self.play(Create(circle))
        self.wait(1)`,notes:null,tableData:null},{title:"Basic Shapes — How to Add Them",content:"Every shape is one line to create, then wrap it in self.play(Create(...)) to animate it onto the screen.",code:`# Circle
circle = Circle(radius=2, color=BLUE)
self.play(Create(circle))

# Square
square = Square(side_length=2, color=GREEN)
self.play(Create(square))

# Triangle
triangle = Triangle(color=RED)
self.play(Create(triangle))

# Rectangle
rect = Rectangle(width=4, height=2, color=YELLOW)
self.play(Create(rect))

# Line
line = Line(start=LEFT*2, end=RIGHT*2, color=WHITE)
self.play(Create(line))

# Dot (a point)
dot = Dot(point=ORIGIN, color=PINK)
self.play(Create(dot))

# Arrow
arrow = Arrow(start=LEFT, end=RIGHT, color=ORANGE)
self.play(Create(arrow))

# Polygon (any number of custom points)
polygon = Polygon(
    [-1,-1,0], [1,-1,0], [1,1,0], [-1,1,0],
    color=PURPLE
)
self.play(Create(polygon))

# Ellipse
ellipse = Ellipse(width=4, height=2, color=TEAL)
self.play(Create(ellipse))

# Star
star = Star(n=5, outer_radius=2, color=GOLD)
self.play(Create(star))`,notes:null,tableData:null},{title:"Fill Color — Filling a Shape with Color",content:"Creating a shape only draws its outline. To fill the inside, set fill_color and fill_opacity (0 = invisible, 1 = fully solid).",code:`# Method 1 — set when creating
circle = Circle(
    color=BLUE,
    fill_color=BLUE,
    fill_opacity=0.8
)
self.play(Create(circle))

# Method 2 — .set_fill() after creating
square = Square(color=GREEN)
square.set_fill(GREEN, opacity=0.6)
self.play(Create(square))

# Animate the fill appearing (fade in the color)
triangle = Triangle(color=RED)
self.play(Create(triangle))
self.play(triangle.animate.set_fill(RED, opacity=1))

# Different outline color vs fill color
star = Star(color=WHITE, fill_color=YELLOW, fill_opacity=1)
self.play(Create(star))`,notes:null,tableData:null},{title:"Colors — Solid & Mixed (Part 1)",content:"Manim ships built-in color constants, but you can also mix your own using hex codes or by blending two colors together.",code:`# Built-in named colors
RED, BLUE, GREEN, YELLOW, ORANGE, PURPLE, PINK,
WHITE, BLACK, GRAY, GOLD, TEAL, MAROON

# Shades — add _A through _E (A=lightest, E=darkest)
BLUE_A   # very light blue
BLUE_E   # very dark blue
RED_C    # medium red (same as RED)`,notes:null,tableData:null},{title:"Colors — Solid & Mixed (Part 2)",content:null,code:`# Custom hex color — use any color you want
custom = Circle(color="#ff6b9d", fill_color="#ff6b9d", fill_opacity=1)

# Mix two colors together (average of the two)
mixed_color = average_color(RED, BLUE)     # purple-ish
shape = Square(color=mixed_color, fill_color=mixed_color, fill_opacity=1)

# Gradient fill — blends smoothly between two colors
gradient_shape = Circle(
    fill_opacity=1,
    color=WHITE
)
gradient_shape.set_color(color=[BLUE, GREEN])   # gradient across the shape

# Interpolate between colors by a fraction (0 to 1)
half_mix = interpolate_color(RED, YELLOW, 0.5)  # halfway between red & yellow`,notes:null,tableData:null},{title:"Color Library — Every Built-in Color Name (Part 1)",content:"The full list of built-in color constants, grouped by family. Every color below has 5 shade levels — add _A (lightest) through _E (darkest) to the name, e.g. PURPLE_A , PURPLE_E . Using the plain name (no suffix) gives you the default middle shade (same as _C ).",code:`# Red family
RED_A, RED_B, RED_C, RED_D, RED_E, RED   # RED = RED_C

# Maroon family (deep red)
MAROON_A, MAROON_B, MAROON_C, MAROON_D, MAROON_E, MAROON

# Pink family
PINK, LIGHT_PINK`,notes:'ℹ️ Full family list at a glance: RED, MAROON, PINK, ORANGE, YELLOW, GOLD, GREEN, TEAL, BLUE, LIGHT_BLUE, PURPLE, GRAY/GREY, WHITE, BLACK . Most support _A – _E shades. You can always fall back to a custom hex string like "#ff6b9d" for any color not in this list — see the custom hex block above.',tableData:null},{title:"Color Library — Every Built-in Color Name (Part 2)",content:null,code:`# Orange family
ORANGE, LIGHT_BROWN, DARK_BROWN

# Yellow family
YELLOW_A, YELLOW_B, YELLOW_C, YELLOW_D, YELLOW_E, YELLOW

# Gold family
GOLD_A, GOLD_B, GOLD_C, GOLD_D, GOLD_E, GOLD`,notes:null,tableData:null},{title:"Color Library — Every Built-in Color Name (Part 3)",content:null,code:`# Green family
GREEN_A, GREEN_B, GREEN_C, GREEN_D, GREEN_E, GREEN

# Teal family
TEAL_A, TEAL_B, TEAL_C, TEAL_D, TEAL_E, TEAL`,notes:null,tableData:null},{title:"Color Library — Every Built-in Color Name (Part 4)",content:null,code:`# Blue family
BLUE_A, BLUE_B, BLUE_C, BLUE_D, BLUE_E, BLUE

# Light blue / sky blue
LIGHT_BLUE

# Purple family
PURPLE_A, PURPLE_B, PURPLE_C, PURPLE_D, PURPLE_E, PURPLE`,notes:null,tableData:null},{title:"Color Library — Every Built-in Color Name (Part 5)",content:null,code:`# Gray family (also spelled GREY_*, both work)
GRAY_A, GRAY_B, GRAY_C, GRAY_D, GRAY_E, GRAY

# Pure black & white
WHITE, BLACK

# Transparent (useful for hiding fill while keeping outline)
Circle(fill_color=BLUE, fill_opacity=0)   # fill_opacity=0 = invisible fill`,notes:null,tableData:null},{title:"Color Library — Every Built-in Color Name (Part 6)",content:null,code:`# As the outline/stroke color
circle = Circle(color=BLUE_D)

# As the fill color (needs fill_opacity too)
square = Square(fill_color=PURPLE_A, fill_opacity=1)

# For text
text = Text("Hello", color=TEAL_E)

# For a MathTex formula
formula = MathTex(r"E = mc^2", color=GOLD_D)

# Changing color later with animation
self.play(circle.animate.set_color(MAROON_C))`,notes:null,tableData:null},{title:"Text — Writing & Coloring It",content:null,code:`# Plain text
text = Text("Hello Manim", font_size=48, color=WHITE)
self.play(Write(text))

# Math text (LaTeX) — for equations
formula = MathTex(r"E = mc^2", font_size=60, color=YELLOW)
self.play(Write(formula))

# Colored text — whole string
colored = Text("Colored Text", color=BLUE)

# Color only part of the text (by substring)
partial = Text("Red and Blue")
partial[0:3].set_color(RED)     # colors just "Red"
partial[8:12].set_color(BLUE)   # colors just "Blue"

# Change color with animation (smooth transition)
self.play(text.animate.set_color(RED))

# Bold / italic (Text uses standard args)
bold_text = Text("Bold", weight=BOLD)
italic_text = Text("Italic", slant=ITALIC)`,notes:null,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 1)",content:'All of these go inside MathTex(r"...") — the r before the quotes matters (raw string, so backslashes work). This is plain LaTeX math syntax. Write the whole formula as one string, or split it into multiple pieces inside { } so you can color or animate parts separately.',code:`# nCr — combinations, "n choose r"
ncr = MathTex(r"^{n}C_{r} = \\frac{n!}{r!(n-r)!}", font_size=60)
self.play(Write(ncr))

# nCr — binomial coefficient notation (the big round-bracket style)
ncr_binom = MathTex(r"\\binom{n}{r} = \\frac{n!}{r!(n-r)!}", font_size=60)

# nPr — permutations
npr = MathTex(r"^{n}P_{r} = \\frac{n!}{(n-r)!}", font_size=60)

# Factorial
factorial = MathTex(r"n!", font_size=60)`,notes:`ℹ️ Pattern for limits everywhere in LaTeX: the symbol comes first ( \\int , \\sum , \\prod , \\lim ), then _{ } for the lower/starting value, then ^{ } for the upper value (integrals and sums use both; \\lim only uses _{ } with \\to inside it). \\, just adds a small space (used before dx ). Always wrap the whole thing in a raw string: MathTex(r"...") . ⚠️ These formulas need a full LaTeX install to render (see Manual Installation above, texlive-latex-extra ). If a symbol doesn't show up or you get a "latex not found" / compile error, check the Troubleshooting table further up this guide.`,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 2)",content:null,code:`# Indefinite integral — plain integral sign
integral = MathTex(r"\\int x^2 \\, dx", font_size=60)
self.play(Write(integral))

# Definite integral — limits go in _{lower}^{upper} right after \\int
definite_integral = MathTex(r"\\int_{0}^{1} x^2 \\, dx = \\frac{1}{3}", font_size=60)
self.play(Write(definite_integral))

# Double integral
double_integral = MathTex(r"\\iint_{D} f(x,y) \\, dA", font_size=60)

# Triple integral
triple_integral = MathTex(r"\\iiint_{V} f(x,y,z) \\, dV", font_size=60)

# Closed line/surface integral (loop through the sign)
closed_integral = MathTex(r"\\oint_{C} \\vec{F} \\cdot d\\vec{r}", font_size=60)`,notes:null,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 3)",content:null,code:`# Summation — \\sum, limits again go in _{lower}^{upper}
summation = MathTex(r"\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}", font_size=60)
self.play(Write(summation))

# Summation to infinity
infinite_sum = MathTex(r"\\sum_{n=0}^{\\infty} \\frac{1}{n!} = e", font_size=60)

# Product sign (big pi) — same limit syntax as summation
product = MathTex(r"\\prod_{i=1}^{n} i = n!", font_size=60)`,notes:null,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 4)",content:null,code:`# Limit — \\lim with the approach value under it via \\to
limit = MathTex(r"\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1", font_size=60)
self.play(Write(limit))

# Limit going to infinity
limit_inf = MathTex(r"\\lim_{x \\to \\infty} \\frac{1}{x} = 0", font_size=60)

# One-sided limits — add ^+ or ^- to the approach value
limit_right = MathTex(r"\\lim_{x \\to 0^{+}} f(x)", font_size=60)
limit_left = MathTex(r"\\lim_{x \\to 0^{-}} f(x)", font_size=60)`,notes:null,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 5)",content:null,code:`# Derivative — Leibniz notation (d/dx form)
derivative = MathTex(r"\\frac{d}{dx} x^2 = 2x", font_size=60)
self.play(Write(derivative))

# Derivative of a function y — dy/dx
dy_dx = MathTex(r"\\frac{dy}{dx}", font_size=60)

# Prime notation — f'(x), f''(x)
prime = MathTex(r"f'(x) = 2x \\quad f''(x) = 2", font_size=60)

# Second derivative — Leibniz form
second_derivative = MathTex(r"\\frac{d^2y}{dx^2}", font_size=60)

# Partial derivative — use \\partial instead of d
partial_derivative = MathTex(r"\\frac{\\partial f}{\\partial x}", font_size=60)`,notes:null,tableData:null},{title:"Math Symbols & Formulas — Integrals, Summation, Limits, Derivatives, nCr (Part 6)",content:null,code:`# Square root / nth root
sqrt = MathTex(r"\\sqrt{x}", font_size=60)
nth_root = MathTex(r"\\sqrt[n]{x}", font_size=60)

# Fractions
fraction = MathTex(r"\\frac{a}{b}", font_size=60)

# Greek letters — just backslash + name
greek = MathTex(r"\\alpha \\beta \\gamma \\theta \\pi \\sigma \\Delta \\Sigma \\Omega", font_size=60)

# Infinity, plus-minus, not-equal, approx
symbols = MathTex(r"\\infty \\quad \\pm \\quad \\neq \\quad \\approx", font_size=60)

# Inequalities
inequalities = MathTex(r"\\leq \\quad \\geq \\quad \\ll \\quad \\gg", font_size=60)

# Vectors — arrow on top
vector = MathTex(r"\\vec{F} = m\\vec{a}", font_size=60)

# Set membership / subset
sets = MathTex(r"x \\in \\mathbb{R} \\quad A \\subset B", font_size=60)

# Matrix (2x2 example)
matrix = MathTex(r"\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}", font_size=60)`,notes:null,tableData:null},{title:"Transform — Morphing Shapes & Text",content:"Transform smoothly morphs one object into another. ReplacementTransform does the same but fully replaces the original object (better when the two are very different shapes).",code:`# Transform a circle into a square
circle = Circle(color=BLUE)
square = Square(color=GREEN)
self.play(Create(circle))
self.play(Transform(circle, square))
self.wait(1)

# ReplacementTransform — cleaner for very different shapes
triangle = Triangle(color=RED)
star = Star(color=YELLOW)
self.play(Create(triangle))
self.play(ReplacementTransform(triangle, star))

# Transform text into other text
text1 = Text("Before")
text2 = Text("After")
self.play(Write(text1))
self.play(Transform(text1, text2))

# Transform a formula into another formula (great for step-by-step math)
eq1 = MathTex(r"x + 2 = 5")
eq2 = MathTex(r"x = 3")
self.play(Write(eq1))
self.play(TransformMatchingTex(eq1, eq2))  # matches similar symbols`,notes:null,tableData:null},{title:"Positioning — Moving to Edges & Corners (Part 1)",content:"Every object can be moved with .to_edge() , .to_corner() , .shift() , or .move_to() .",code:`# To an edge
shape.to_edge(UP)               # top center
shape.to_edge(DOWN)             # bottom center
shape.to_edge(LEFT)             # middle left
shape.to_edge(RIGHT)            # middle right

# To a corner
shape.to_corner(UP + LEFT)      # top-left
shape.to_corner(UP + RIGHT)     # top-right
shape.to_corner(DOWN + LEFT)    # bottom-left
shape.to_corner(DOWN + RIGHT)   # bottom-right

# Shift relative to current position
shape.shift(UP * 2)          # move up by 2 units
shape.shift(DOWN * 1)         # move down by 1 unit
shape.shift(LEFT * 3)         # move left by 3 units
shape.shift(RIGHT + UP)      # move diagonally (right + up)

# Move to an exact coordinate
shape.move_to(ORIGIN)        # dead center
shape.move_to([2, 1, 0])     # x=2, y=1

# Position relative to another object
label.next_to(circle, UP)          # above the circle
label.next_to(circle, DOWN, buff=0.5)  # below, with gap
label.next_to(circle, RIGHT)       # to the right of it

# Animate the move (instead of instant jump)
self.play(shape.animate.to_edge(UP))
self.play(shape.animate.shift(RIGHT * 2))`,notes:"🧭 Direction cheat sheet: UP , DOWN , LEFT , RIGHT are built in. Combine them for diagonals: UP+LEFT = top-left, DOWN+RIGHT = bottom-right, etc.",tableData:null},{title:"Positioning — Moving to Edges & Corners (Part 2)",content:null,code:`# Create text in the center (default position) and show it
text1 = Text("Integral")
self.play(Create(text1))
self.wait(1)

# Animate that same text sliding up to the top-center edge
self.play(text1.animate.to_edge(UP))`,notes:null,tableData:null},{title:".shift() — Full Guide (What It Is, When to Use It) (Part 1)",content:`.shift() moves an object relative to where it already is — it adds an offset to the current position. This is different from .move_to() , which sends the object to an exact, absolute coordinate no matter where it started. Use .shift() whenever you're thinking "move it a bit more from here," and use .move_to() when you're thinking "put it exactly at this spot."`,code:`# The four basic directions — each is a unit vector you scale with *
shape.shift(UP)                 # up by 1 unit (default)
shape.shift(UP * 2)             # up by 2 units
shape.shift(DOWN * 1.5)         # down by 1.5 units
shape.shift(LEFT * 3)           # left by 3 units
shape.shift(RIGHT * 0.5)        # right by half a unit

# Negative numbers flip the direction (same as the opposite constant)
shape.shift(UP * -2)            # same as shift(DOWN * 2)`,notes:'ℹ️ shift() vs move_to() vs to_edge(): .shift(v) = "move by this much from where I am now" (relative). .move_to(point) = "go to this exact coordinate" (absolute — ignores current position). .to_edge(direction) / .to_corner(direction) = "snap to this edge/corner of the screen" (also absolute). If you call .shift() twice, the offsets add up; if you call .move_to() twice, only the last call matters. ⚠️ 1 unit in Manim is not 1 pixel — by default the visible frame is about 14.2 units wide and 8 units tall. So shift(RIGHT * 8) is roughly enough to push something off the right edge of a normal frame.',tableData:null},{title:".shift() — Full Guide (What It Is, When to Use It) (Part 2)",content:null,code:`# Add two directions together for a diagonal move
shape.shift(RIGHT + UP)              # diagonally up-right by 1 unit each
shape.shift(RIGHT * 2 + UP * 1)      # further right than up
shape.shift(LEFT * 2 + DOWN * 2)    # diagonally down-left

# Shift using a raw [x, y, z] vector instead of UP/DOWN/etc.
shape.shift([1.5, -0.5, 0])       # right 1.5, down 0.5

# Shift along the z-axis (only matters in 3D scenes)
shape.shift(OUT * 2)            # toward the camera
shape.shift(IN * 2)             # away from the camera

# Chaining shifts — each one stacks on top of the last
shape.shift(RIGHT * 2).shift(UP * 1)   # same result as shift(RIGHT*2 + UP*1)`,notes:null,tableData:null},{title:".shift() — Full Guide (What It Is, When to Use It) (Part 3)",content:null,code:`# Instant jump (no animation) — happens immediately, before self.play
shape.shift(UP * 2)

# Animated — wrap with .animate and pass to self.play
self.play(shape.animate.shift(UP * 2))

# Control how long the animation takes
self.play(shape.animate.shift(RIGHT * 3), run_time=2)

# Shift several objects at once in the same animation
self.play(
    circle.animate.shift(LEFT * 2),
    square.animate.shift(RIGHT * 2)
)

# Shift, then shift again — two separate animation beats
self.play(shape.animate.shift(UP * 1))
self.wait(0.5)
self.play(shape.animate.shift(RIGHT * 1))`,notes:null,tableData:null},{title:".shift() — Full Guide (What It Is, When to Use It) (Part 4)",content:null,code:`# Nudge a label off of the shape it's labeling
label = Text("radius").shift(UP * 0.5)

# Slide an object off screen (to make room / clear the scene)
self.play(shape.animate.shift(LEFT * 8))   # moves off the left edge

# Make a copy and shift only the copy (keeps the original in place)
shape_copy = shape.copy().shift(RIGHT * 3)
self.play(Create(shape_copy))

# Shift a whole group of objects together
group = VGroup(circle, square, triangle)
self.play(group.animate.shift(DOWN * 1))

# Small correction after positioning (fine-tune placement)
label.next_to(circle, UP)
label.shift(RIGHT * 0.2)   # nudge it slightly right`,notes:null,tableData:null},{title:"Matrices — As a Real Object on Screen",content:"Use Matrix() when you want a matrix as its own object you can move, transform, or animate entry-by-entry (not just static LaTeX text). It takes a plain Python list of lists.",code:`# Basic matrix — pass a list of rows
matrix = Matrix([[1, 2], [3, 4]])
self.play(Create(matrix))

# Matrix with brackets style (round, square, curly)
round_matrix = Matrix([[1, 0], [0, 1]], left_bracket="(", right_bracket=")")

# 3x3 matrix
matrix3 = Matrix([[1, 2, 3], [4, 5, 6], [7, 8, 9]])

# Color a single entry — get_entries() returns them in reading order
matrix.get_entries()[0].set_color(YELLOW)   # colors the "1"

# Add brackets/rows highlight, or write it in with animation
self.play(Write(matrix))

# Matrix multiplication equation — mixing Matrix() with MathTex
eq = MathTex(r"\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}"
             r"\\begin{bmatrix} x \\\\ y \\end{bmatrix} ="
             r"\\begin{bmatrix} ax+by \\\\ cx+dy \\end{bmatrix}", font_size=48)
self.play(Write(eq))`,notes:null,tableData:null},{title:"2D Graphs — Axes, Plotting Functions, log(x) (Part 1)",content:"Axes() creates an x-y coordinate grid you can plot any function on with axes.plot(...) . This is the standard way to draw a graph — including log(x) , trig functions, or anything else you can write as a Python lambda .",code:`from manim import *
import numpy as np

class GraphScene(Scene):
    def construct(self):
        # Build the axes first — set ranges to fit your function
        axes = Axes(
            x_range=[-1, 10, 1],
            y_range=[-3, 3, 1],
            axis_config={"color": WHITE},
            tips=True
        )
        # Optional numeric labels on the axes
        labels = axes.get_axis_labels(x_label="x", y_label="y")
        self.play(Create(axes), Write(labels))

        # Plot log(x) — use x_range on the plot to avoid log(0)
        log_graph = axes.plot(lambda x: np.log(x), x_range=[0.1, 10], color=YELLOW)
        log_label = MathTex(r"y = \\log(x)", color=YELLOW).next_to(log_graph, UP)
        self.play(Create(log_graph), Write(log_label))
        self.wait(1)`,notes:"ℹ️ Always give log / 1/x plots an x_range starting just above 0 (like 0.1 ) — plugging in x = 0 is undefined and will error or break the graph.",tableData:null},{title:"2D Graphs — Axes, Plotting Functions, log(x) (Part 2)",content:null,code:`# log base 10 instead of natural log
log10_graph = axes.plot(lambda x: np.log10(x), x_range=[0.1, 10], color=ORANGE)

# Parabola
parabola = axes.plot(lambda x: x**2, color=BLUE)

# Sine wave
sine_graph = axes.plot(lambda x: np.sin(x), color=GREEN)

# Exponential
exp_graph = axes.plot(lambda x: np.exp(x), x_range=[-2, 2], color=PURPLE)

# 1/x (has an asymptote — split into two plots to avoid the gap being joined)
inv_graph_pos = axes.plot(lambda x: 1/x, x_range=[0.1, 10], color=RED)
inv_graph_neg = axes.plot(lambda x: 1/x, x_range=[-10, -0.1], color=RED)

# Shade the area under a curve (e.g. for definite integrals)
area = axes.get_area(parabola, x_range=[0, 2], color=BLUE, opacity=0.4)
self.play(FadeIn(area))

# A dot that traces along a graph
dot = Dot(color=YELLOW).move_to(axes.i2gp(0, parabola))
self.play(MoveAlongPath(dot, parabola), run_time=3)`,notes:null,tableData:null},{title:"3D Animations — Cubes, Spheres & Axes (Part 1)",content:"3D scenes use a different base class: ThreeDScene instead of Scene . You also set a camera angle so you're not just staring at 3D objects flat-on.",code:`from manim import *

class My3DScene(ThreeDScene):
    def construct(self):
        # set the camera angle first
        self.set_camera_orientation(phi=75 * DEGREES, theta=30 * DEGREES)

        axes = ThreeDAxes()
        cube = Cube(side_length=2, fill_color=BLUE, fill_opacity=0.7)

        self.play(Create(axes))
        self.play(Create(cube))
        self.wait(2)`,notes:"⚠️ 3D scenes are heavier to render on a tablet. Always test with -ql first, and use --renderer=opengl for a real speed boost on 3D-heavy scenes.",tableData:null},{title:"3D Animations — Cubes, Spheres & Axes (Part 2)",content:null,code:`# Cube
cube = Cube(side_length=2, fill_color=BLUE, fill_opacity=0.7)

# Sphere
sphere = Sphere(radius=2, fill_color=RED, fill_opacity=0.7)

# Cylinder
cylinder = Cylinder(radius=1, height=3, fill_color=GREEN, fill_opacity=0.7)

# Cone
cone = Cone(base_radius=1, height=2, fill_color=YELLOW, fill_opacity=0.7)

# 3D Axes
axes = ThreeDAxes(
    x_range=[-5, 5, 1],
    y_range=[-5, 5, 1],
    z_range=[-5, 5, 1]
)

# 3D Surface (parametric — e.g. for graphing z = f(x,y))
surface = Surface(
    lambda u, v: axes.c2p(u, v, np.sin(u) * np.cos(v)),
    u_range=[-3, 3],
    v_range=[-3, 3],
    fill_color=BLUE,
    fill_opacity=0.6
)`,notes:null,tableData:null},{title:"3D Animations — Cubes, Spheres & Axes (Part 3)",content:null,code:`from manim import *
import numpy as np

class ThreeDGraphScene(ThreeDScene):
    def construct(self):
        self.set_camera_orientation(phi=75 * DEGREES, theta=30 * DEGREES)

        axes = ThreeDAxes(
            x_range=[-4, 4, 1],
            y_range=[-4, 4, 1],
            z_range=[-4, 4, 1]
        )
        self.play(Create(axes))

        # 3D parametric curve — e.g. a helix, x(t), y(t), z(t)
        helix = ParametricFunction(
            lambda t: axes.c2p(np.cos(t), np.sin(t), t * 0.3),
            t_range=[0, 4 * PI],
            color=YELLOW
        )
        self.play(Create(helix))

        # 3D surface plot — z = f(x, y), e.g. a paraboloid z = x^2 + y^2
        paraboloid = Surface(
            lambda u, v: axes.c2p(u, v, (u**2 + v**2) / 4),
            u_range=[-2, 2],
            v_range=[-2, 2],
            fill_color=BLUE,
            fill_opacity=0.7,
            checkerboard_colors=[BLUE_D, BLUE_E]  # optional grid look
        )
        self.play(Create(paraboloid))
        self.wait(2)`,notes:null,tableData:null},{title:"3D Animations — Cubes, Spheres & Axes (Part 4)",content:null,code:`# Sine wave surface — z = sin(x) * cos(y)
wave_surface = Surface(
    lambda u, v: axes.c2p(u, v, np.sin(u) * np.cos(v)),
    u_range=[-4, 4],
    v_range=[-4, 4],
    fill_color=TEAL,
    fill_opacity=0.7
)

# Sphere as a parametric surface (instead of the built-in Sphere())
sphere_surface = Surface(
    lambda u, v: axes.c2p(
        2 * np.cos(u) * np.sin(v),
        2 * np.sin(u) * np.sin(v),
        2 * np.cos(v)
    ),
    u_range=[0, TAU], v_range=[0, PI],
    fill_color=RED, fill_opacity=0.6
)

# 3D spiral / coil (tighter helix)
coil = ParametricFunction(
    lambda t: axes.c2p(np.cos(t) * 0.5, np.sin(t) * 0.5, t * 0.1),
    t_range=[0, 6 * PI],
    color=GREEN
)`,notes:null,tableData:null},{title:"3D Animations — Cubes, Spheres & Axes (Part 5)",content:null,code:`# Slowly rotate the camera around the scene
self.begin_ambient_camera_rotation(rate=0.2)
self.wait(5)
self.stop_ambient_camera_rotation()

# Or move the camera to a new fixed angle
self.move_camera(phi=60 * DEGREES, theta=45 * DEGREES, run_time=2)`,notes:null,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 1)",content:"Every animation in Manim is a wrapper you pass into self.play(...) . This is the full toolkit, grouped by what you're trying to do: bring something onto screen, take it off, morph one thing into another, move it, or draw attention to it.",code:`# Create — draws the outline/stroke of a shape (most common)
self.play(Create(circle))

# Write — for text and MathTex, writes it stroke by stroke like handwriting
self.play(Write(text))
self.play(Write(formula))

# FadeIn — simply fades in from invisible to visible
self.play(FadeIn(shape))

# FadeIn from a direction — fades in while sliding from that side
self.play(FadeIn(shape, shift=UP))
self.play(FadeIn(shape, shift=RIGHT * 2))

# GrowFromCenter — scales up from a single point in the middle
self.play(GrowFromCenter(shape))

# GrowFromEdge / GrowFromPoint — grows from a specific edge or coordinate
self.play(GrowFromEdge(shape, LEFT))
self.play(GrowFromPoint(shape, ORIGIN))

# GrowArrow — arrow-specific grow-in animation
self.play(GrowArrow(arrow))

# DrawBorderThenFill — draws the outline first, then fills it in
self.play(DrawBorderThenFill(shape))

# SpinInFromNothing — spins in while growing from nothing
self.play(SpinInFromNothing(shape))`,notes:`ℹ️ Which "transform" do I use? Plain Transform(A, B) when you'll keep referring to A afterward (it now looks like B). ReplacementTransform(A, B) when B is the object you'll use going forward and the shapes are very different. TransformMatchingTex for step-by-step equation edits (keeps matching symbols steady). FadeTransform when you just want a smooth crossfade rather than a literal morph. 💾 Saving your render: Manim saves automatically — every self.play() is baked into the output video file when you run manim -ql file.py SceneName . There's no separate "save" step; the finished .mp4 lands in media/videos/.../ (see Step 5 — Find & Copy the Output Video above). To render a fresh version after edits, just re-run the same render command — Manim overwrites/creates a new file each time.`,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 2)",content:null,code:`# FadeOut — simply fades to invisible
self.play(FadeOut(shape))

# FadeOut in a direction — fades while sliding that way
self.play(FadeOut(shape, shift=DOWN))

# Uncreate — reverse of Create, un-draws the outline
self.play(Uncreate(shape))

# ShrinkToCenter — shrinks down to a point and disappears
self.play(ShrinkToCenter(shape))

# self.remove() — instantly removes with NO animation (use outside self.play)
self.remove(shape)

# Clear everything on screen at once
self.play(*[FadeOut(m) for m in self.mobjects])`,notes:null,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 3)",content:null,code:`# Transform — morphs shape A to look like shape B, but A stays the object in the scene
# (using A again later still refers to the same mobject, now shaped like B)
circle = Circle(color=BLUE)
square = Square(color=GREEN)
self.play(Create(circle))
self.play(Transform(circle, square))

# ReplacementTransform — morphs A into B, then B fully replaces A in the scene
# (cleaner when the two shapes are very different, e.g. circle -> star)
triangle = Triangle(color=RED)
star = Star(color=YELLOW)
self.play(Create(triangle))
self.play(ReplacementTransform(triangle, star))

# TransformMatchingTex — morphs one formula into another, matching identical symbols
# so shared parts glide into place instead of the whole thing dissolving
eq1 = MathTex(r"x + 2 = 5")
eq2 = MathTex(r"x = 3")
self.play(Write(eq1))
self.play(TransformMatchingTex(eq1, eq2))

# TransformMatchingShapes — same idea but for general shapes/VGroups, not just Tex
self.play(TransformMatchingShapes(triangle, star))

# FadeTransform — crossfades between the two objects (fade out A while fading in B)
self.play(FadeTransform(circle, square))

# CounterclockwiseTransform / ClockwiseTransform — like Transform but forces
# the morph to visibly rotate in that direction as it happens
self.play(ClockwiseTransform(circle, square))`,notes:null,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 4)",content:null,code:`# .animate — the general-purpose way to animate ANY property change
self.play(shape.animate.shift(UP * 2))
self.play(shape.animate.move_to(ORIGIN))
self.play(shape.animate.scale(2))          # scale up 2x
self.play(shape.animate.scale(0.5))        # scale down to half
self.play(shape.animate.rotate(PI / 4))    # rotate 45°
self.play(shape.animate.set_color(RED))
self.play(shape.animate.to_edge(UP))

# MoveToTarget — set a target state first, then animate toward it
shape.generate_target()
shape.target.shift(RIGHT * 3)
shape.target.set_color(YELLOW)
self.play(MoveToTarget(shape))

# MoveAlongPath — animate an object sliding along a curve/graph
self.play(MoveAlongPath(dot, path))

# Rotate — dedicated rotate animation (alternative to .animate.rotate)
self.play(Rotate(shape, angle=PI, about_point=ORIGIN))`,notes:null,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 5)",content:null,code:`# Indicate — briefly grows and changes color, then returns to normal
self.play(Indicate(shape))

# Circumscribe — draws a temporary highlight box/circle around it
self.play(Circumscribe(shape))
self.play(Circumscribe(shape, Circle))   # circle instead of the default rectangle

# Flash — a quick burst of lines radiating from a point
self.play(Flash(dot))

# Wiggle — a small shake/wiggle to draw the eye
self.play(Wiggle(shape))

# FocusOn — dims everything else, spotlighting this object
self.play(FocusOn(shape))

# ApplyWave — a ripple/wave distortion passes through the object
self.play(ApplyWave(shape))`,notes:null,tableData:null},{title:"Animation Library — Every Animation You'll Use, Grouped by Purpose (Part 6)",content:null,code:`# Play multiple animations at the same time (simultaneously)
self.play(Create(circle), Write(text))

# Play animations one after another — just call self.play() again
self.play(Create(circle))
self.play(Write(text), run_time=1.5)

# AnimationGroup — bundles several animations, each with its own delay offset
self.play(AnimationGroup(
    Create(circle),
    Write(text),
    lag_ratio=0.5   # text starts halfway through the circle's animation
))

# LaggedStart — plays a list of animations with a staggered start (nice for lists/groups)
self.play(LaggedStart(
    FadeIn(item1), FadeIn(item2), FadeIn(item3),
    lag_ratio=0.3
))

# Succession — plays animations strictly one after another in a single self.play call
self.play(Succession(Create(circle), Write(text)))`,notes:null,tableData:null},{title:"Quick Reference — Everything on One Page",content:null,code:null,notes:"💡 Bookmark this section ( #writing ) — it's built to be searched, not read top to bottom. Every time you forget a command, come back and Ctrl+F for it.",tableData:{headers:["What you want","Command"],rows:[["Circle / Square / Triangle","Circle() / Square() / Triangle()"],["Fill a shape with color","fill_color=BLUE, fill_opacity=1"],["Custom / mixed color",'"#ff6b9d" or average_color(RED, BLUE)'],["Color shades","BLUE_A (lightest) through BLUE_E (darkest)"],["Plain text",'Text("hello")'],["Math formula",'MathTex(r"x^2")'],["nCr formula",'MathTex(r"\\binom{n}{r} = \\frac{n!}{r!(n-r)!}")'],["Definite integral",'MathTex(r"\\int_{0}^{1} x^2 \\, dx")'],["Summation with limits",'MathTex(r"\\sum_{i=1}^{n} i")'],["Limit",'MathTex(r"\\lim_{x \\to 0} f(x)")'],["Derivative",'MathTex(r"\\frac{d}{dx} x^2")'],["Color part of text","text[0:3].set_color(RED)"],["Matrix as an object","Matrix([[1,2],[3,4]])"],["Morph shape A into B","Transform(A, B)"],["Morph A into B, B replaces A","ReplacementTransform(A, B)"],["Morph one formula into another","TransformMatchingTex(eq1, eq2)"],["Crossfade A into B","FadeTransform(A, B)"],["Fade in / out","FadeIn(shape) / FadeOut(shape)"],["Un-draw a shape","Uncreate(shape)"],["Remove instantly, no animation","self.remove(shape)"],["Highlight without changing it","Indicate(shape) / Circumscribe(shape) / Flash(dot)"],["Stagger a list of animations","LaggedStart(..., lag_ratio=0.3)"],["Move to edge/corner",".to_edge(UP) / .to_corner(DOWN+LEFT)"],["Move by offset (relative)",".shift(RIGHT*2)"],["Animate a shift","self.play(shape.animate.shift(UP*2))"],["Shift a group of objects","VGroup(a,b,c).animate.shift(DOWN)"],["Move next to another object",".next_to(obj, UP)"],["2D graph axes","Axes(x_range=[...], y_range=[...])"],["Plot a function (e.g. log x)","axes.plot(lambda x: np.log(x), x_range=[0.1,10])"],["Shade area under curve","axes.get_area(graph, x_range=[0,2])"],["3D scene base class","class X(ThreeDScene)"],["3D camera angle","self.set_camera_orientation(phi=75*DEGREES, theta=30*DEGREES)"],["Cube / Sphere / Cylinder","Cube() / Sphere() / Cylinder()"],["3D axes","ThreeDAxes()"],["3D curve on x-y-z axes","ParametricFunction(lambda t: axes.c2p(...), t_range=[...])"],["3D surface z = f(x,y)","Surface(lambda u,v: axes.c2p(u, v, f(u,v)), u_range, v_range)"],["Rotate camera around scene","self.begin_ambient_camera_rotation(rate=0.2)"]]}},{title:"MathTex Symbol Reference — Every Symbol, By Category",content:`Every code below works directly inside MathTex(r"...") . This is built on Manim's default TeX template ( amsmath + amssymb ), so nothing here needs an extra package or config change.`,code:null,notes:`ℹ️ All symbols confirmed against Manim Community's default TeX template ( amsmath + amssymb ). Use inside MathTex(r"...") exactly as shown in the Code column.`,tableData:{headers:["Name","Code","Result"],rows:[["alpha","\\alpha","α"],["beta","\\beta","β"],["gamma","\\gamma","γ"],["delta","\\delta","δ"],["epsilon","\\epsilon","ϵ"],["varepsilon","\\varepsilon","ε"],["zeta","\\zeta","ζ"],["eta","\\eta","η"],["theta","\\theta","θ"],["vartheta","\\vartheta","ϑ"],["iota","\\iota","ι"],["kappa","\\kappa","κ"],["lambda","\\lambda","λ"],["mu","\\mu","μ"],["nu","\\nu","ν"],["xi","\\xi","ξ"],["pi","\\pi","π"],["varpi","\\varpi","ϖ"],["rho","\\rho","ρ"],["varrho","\\varrho","ϱ"],["sigma","\\sigma","σ"],["varsigma","\\varsigma","ς"],["tau","\\tau","τ"],["upsilon","\\upsilon","υ"],["phi","\\phi","ϕ"],["varphi","\\varphi","φ"],["chi","\\chi","χ"],["psi","\\psi","ψ"],["omega","\\omega","ω"]]}}]},{id:"chapter-7",chapterNumber:"07",title:"07 Install VS Code on Android (proot-distro way)",summary:"Run code-server in proot Ubuntu and edit Manim scripts with full IDE capabilities in your mobile browser.",steps:[{title:"07 Install VS Code on Android (proot-distro way) - Step 1",con import soundfile as sf
import numpy as np
import json
import os
import sys
import time

from rich.console import Console
from rich.panel import Panel
from rich.table import Table
from rich.prompt import Prompt
from rich.progress import Progress, SpinnerColumn, TextColumn, BarColumn, TaskProgressColumn
from rich.align import Align
from rich import box
from rich.text import Text

console = Console()

# =====================================================================
# DIRECTORY & PATH CONFIGURATION (CUSTOMIZE YOUR PATHS HERE)
# =====================================================================
SCRIPT_DIR = os.path.dirname(os.path.abspath(__file__))

# Folder where downloaded models are stored
MODELS_DIR = os.path.join(SCRIPT_DIR, "models")

# Config file path
CONFIG_FILE = os.path.join(SCRIPT_DIR, "config.json")

# Fallback values if config.json is not found
DEFAULT_OUTPUT_DIR = "/sdcard/Download/Categories/VoiceoverOutput"
DEFAULT_SID = 0
DEFAULT_SPEED = 1.0
DEFAULT_THREADS = 4
CONFIG_MODEL_DIR = ""

# Load settings from config file if available
if os.path.exists(CONFIG_FILE):
    try:
        with open(CONFIG_FILE, "r", encoding="utf-8") as f:
            cfg = json.load(f)
            DEFAULT_OUTPUT_DIR = cfg.get("output_dir", DEFAULT_OUTPUT_DIR)
            DEFAULT_SID = cfg.get("default_sid", DEFAULT_SID)
            DEFAULT_SPEED = cfg.get("default_speed", DEFAULT_SPEED)
            DEFAULT_THREADS = cfg.get("num_threads", DEFAULT_THREADS)
            CONFIG_MODEL_DIR = cfg.get("model_dir", "")
    except Exception:
        pass

# Ensure output destination exists
os.makedirs(DEFAULT_OUTPUT_DIR, exist_ok=True)

# =====================================================================
# SPEAKER PROFILES & PRESETS
# =====================================================================
KOKORO_EN_SPEAKERS = {
    0: "af [bold pink1][FEMALE][/bold pink1] American (Default)",
    1: "af_bella [bold pink1][FEMALE][/bold pink1] American (Soft)",
    2: "af_nicole [bold pink1][FEMALE][/bold pink1] American (Casual)",
    3: "af_sarah [bold pink1][FEMALE][/bold pink1] American (Educational)",
    4: "af_sky [bold pink1][FEMALE][/bold pink1] American (Light)",
    5: "am_adam [bold cyan][MALE][/bold cyan] American (Dynamic/Tutorial)",
    6: "am_michael [bold cyan][MALE][/bold cyan] American (Warm)",
    7: "bf_emma [bold pink1][FEMALE][/bold pink1] British (Professional)",
    8: "bf_isabella [bold pink1][FEMALE][/bold pink1] British (Calm)",
    9: "bm_george [bold cyan][MALE][/bold cyan] British (Deep & Articulate)",
    10: "bm_lewis [bold cyan][MALE][/bold cyan] British (Confident)"
}

KOKORO_MULTI_SPEAKERS = {
    0: "af_alloy [FEMALE/US]", 1: "af_aoede [FEMALE/US]", 2: "af_bella [FEMALE/US]",
    3: "af_heart [FEMALE/US]", 4: "af_jessica [FEMALE/US]", 5: "af_kore [FEMALE/US]",
    6: "af_nicole [FEMALE/US]", 7: "af_nova [FEMALE/US]", 8: "af_river [FEMALE/US]",
    9: "af_sarah [FEMALE/US]", 10: "af_sky [FEMALE/US]", 11: "am_adam [MALE/US]",
    12: "am_echo [MALE/US]", 13: "am_eric [MALE/US]", 14: "am_fenrir [MALE/US]",
    15: "am_liam [MALE/US]", 16: "am_michael [MALE/US]", 17: "am_onyx [MALE/US]",
    18: "am_puck [MALE/US]", 19: "am_santa [MALE/US]", 20: "bf_alice [FEMALE/UK]",
    21: "bf_emma [FEMALE/UK]", 22: "bf_isabella [FEMALE/UK]", 23: "bf_lily [FEMALE/UK]",
    24: "bm_daniel [MALE/UK]", 25: "bm_fable [MALE/UK]", 26: "bm_george [MALE/UK]",
    27: "bm_lewis [MALE/UK]", 29: "hf_alpha [bold yellow][FEMALE/HINDI][/bold yellow]",
    30: "hf_beta [bold yellow][FEMALE/HINDI][/bold yellow]",
    31: "hm_omega [bold yellow][MALE/HINDI][/bold yellow]",
    28: "ff_siwis [FEMALE/FRENCH]", 32: "jf_alpha [JAPANESE]",
    48: "ef_dora [SPANISH]", 51: "if_sara [ITALIAN]"
}

def render_banner():
    banner_text = Text()
    banner_text.append("✦ ", style="bold bright_cyan")
    banner_text.append("TTS ENGINE ", style="bold bright_white")
    banner_text.append("v2.5 ", style="dim bright_cyan")
    banner_text.append("✦", style="bold bright_cyan")

    console.print(Panel(
        Align.center(banner_text),
        box=box.ROUNDED,
        border_style="bright_blue",
        padding=(0, 2)
    ))

def load_speaker_metadata(model_path):
    speaker_map = {}
    cfg_json = os.path.join(model_path, "config.json")
    if os.path.exists(cfg_json):
        try:
            with open(cfg_json, "r", encoding="utf-8") as f:
                data = json.load(f)
                if "speaker_id_map" in data and isinstance(data["speaker_id_map"], dict):
                    for name, sid in data["speaker_id_map"].items():
                        speaker_map[int(sid)] = f"Speaker '{name}'"
                elif "speakers" in data and isinstance(data["speakers"], list):
                    for sid, name in enumerate(data["speakers"]):
                        speaker_map[sid] = f"Speaker '{name}'"
        except Exception:
            pass

    spk_txt = os.path.join(model_path, "speakers.txt")
    if os.path.exists(spk_txt):
        try:
            with open(spk_txt, "r", encoding="utf-8") as f:
                for idx, line in enumerate(f):
                    line_str = line.strip()
                    if line_str:
                        speaker_map[idx] = f"Speaker '{line_str}'"
        except Exception:
            pass

    return speaker_map

def scan_text_files():
    """Scans the script directory for .txt files."""
    text_dir = SCRIPT_DIR
    if os.path.exists(text_dir):
        files = [f for f in os.listdir(text_dir) if f.endswith(".txt")]
        return sorted(files)
    return []

def main_pipeline():
    console.clear()
    render_banner()

    # Step 1: Detect Models inside models/ directory
    if not os.path.exists(MODELS_DIR):
        console.print(f"[bold red]✗ Error:[/bold red] Models directory not found at '[bold white]{MODELS_DIR}[/bold white]'.", style="red")
        sys.exit(1)

    available_models = [
        d for d in os.listdir(MODELS_DIR)
        if os.path.isdir(os.path.join(MODELS_DIR, d))
    ]

    if not available_models:
        console.print(f"[bold red]✗ Error:[/bold red] No model subdirectories detected inside '{MODELS_DIR}'!", style="red")
        sys.exit(1)

    default_model_index = 1
    if CONFIG_MODEL_DIR:
        config_folder_name = os.path.basename(os.path.normpath(CONFIG_MODEL_DIR))
        if config_folder_name in available_models:
            default_model_index = available_models.index(config_folder_name) + 1

    table = Table(title="[bold bright_white]1. Select Active Model[/bold bright_white]", box=box.ROUNDED, border_style="bright_blue")
    table.add_column("ID", style="bold bright_cyan", justify="center")
    table.add_column("Model Identifier", style="bold white")
    table.add_column("Status", style="bright_green")

    for idx, model_folder in enumerate(available_models, start=1):
        status = "[bold green]Active Default[/bold green]" if idx == default_model_index else "Ready"
        table.add_row(str(idx), model_folder, status)

    console.print(table)

    model_choice = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Choose Model", default=str(default_model_index))
    try:
        selected_model_folder = available_models[int(model_choice) - 1]
    except (ValueError, IndexError):
        selected_model_folder = available_models[default_model_index - 1]

    selected_model_path = os.path.join(MODELS_DIR, selected_model_folder)

    # Step 2: Input Mode Selection & TXT File Scanner
    console.print("\\\\n[bold bright_white]2. Input Source[/bold bright_white]")
    console.print(" [1] Terminal Text Prompt")
    console.print(" [2] Script File (.txt Scanner)")

    input_mode = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Select Mode", choices=["1", "2"], default="1")

    paragraphs = []
    if input_mode == "2":
        detected_files = scan_text_files()

        if detected_files:
            file_table = Table(title="[bold bright_white]Detected Script Files (.txt)[/bold bright_white]", box=box.ROUNDED, border_style="bright_magenta")
            file_table.add_column("ID", style="bold magenta", justify="center")
            file_table.add_column("Filename", style="bold white")
            file_table.add_column("Location", style="dim")

            for f_idx, fname in enumerate(detected_files, start=1):
                file_table.add_row(str(f_idx), fname, f"{SCRIPT_DIR}/{fname}")

            console.print(file_table)

            file_choice = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Select File ID or type full path", default="1")

            try:
                selected_txt = detected_files[int(file_choice) - 1]
                text_file_path = os.path.join(SCRIPT_DIR, selected_txt)
            except (ValueError, IndexError):
                text_file_path = file_choice if os.path.isabs(file_choice) else os.path.join(SCRIPT_DIR, file_choice)
                if not text_file_path.endswith(".txt"):
                    text_file_path += ".txt"
        else:
            console.print("[yellow]![/yellow] No .txt files automatically detected. Enter full file path manually:")
            manual_file = Prompt.ask("Path to .txt file").strip()
            text_file_path = manual_file if os.path.isabs(manual_file) else os.path.join(SCRIPT_DIR, manual_file)
            if not text_file_path.endswith(".txt"):
                text_file_path += ".txt"

        if os.path.exists(text_file_path):
            with open(text_file_path, "r", encoding="utf-8") as f:
                raw_story = f.read().strip()
            paragraphs = [p.strip() for p in raw_story.split("\\\\n") if p.strip()]
            console.print(f"[bold green]✓[/bold green] Loaded '[bold white]{os.path.basename(text_file_path)}[/bold white]' ({len(paragraphs)} paragraphs).")
        else:
            console.print(f"[bold red]✗[/bold red] File not found at '{text_file_path}'. Falling back to prompt input.")
            input_mode = "1"

    if input_mode != "2" or not paragraphs:
        text_input = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Enter Text to Synthesize").strip()
        if not text_input:
            text_input = "In this video, we will solve a challenging definite integral step by step."
        paragraphs = [text_input]

    # Step 3: Speaker Selection
    is_kokoro_multi = "multi" in selected_model_folder.lower()
    is_kokoro_en = "kokoro" in selected_model_folder.lower() and not is_kokoro_multi

    if is_kokoro_multi:
        speaker_map = KOKORO_MULTI_SPEAKERS
    elif is_kokoro_en:
        speaker_map = KOKORO_EN_SPEAKERS
    else:
        speaker_map = load_speaker_metadata(selected_model_path)

    spk_table = Table(title=f"[bold bright_white]3. Speaker Profiles ({selected_model_folder})[/bold bright_white]", box=box.ROUNDED, border_style="bright_blue")
    spk_table.add_column("SID", style="bold bright_cyan", justify="center")
    spk_table.add_column("Speaker Profile / Language", style="bold white")

    if speaker_map:
        for sid_key, desc in list(sorted(speaker_map.items()))[:20]:
            spk_table.add_row(str(sid_key), desc)
        console.print(spk_table)
        if len(speaker_map) > 20:
            console.print(f"[dim]... {len(speaker_map) - 20} additional SIDs available.[/dim]")
    else:
        console.print("[yellow]Numeric Speaker Model. Enter any valid integer SID (e.g. 0 to 900).[/yellow]")

    sid_input = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Select Speaker ID", default=str(DEFAULT_SID))
    try:
        sid = int(sid_input)
    except ValueError:
        sid = DEFAULT_SID

    speaker_label = speaker_map.get(sid, f"Speaker ID {sid}")

    # Step 4: Speed Factor
    speed_input = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Speaking Speed (1.0 = Normal, 1.25 = Fast, 0.85 = Slow)", default=str(DEFAULT_SPEED))
    try:
        current_speed = float(speed_input)
    except ValueError:
        current_speed = DEFAULT_SPEED

    # Step 5: Output Filename
    filename = Prompt.ask("\\\\n[bold cyan]?[/bold cyan] Output Filename", default="voiceover.wav")
    if not filename.endswith(".wav"):
        filename += ".wav"

    output_path = os.path.join(DEFAULT_OUTPUT_DIR, filename)

    # Configuration Summary Card
    console.clear()
    render_banner()

    summary_grid = Table.grid(expand=True)
    summary_grid.add_column(style="bold white", width=18)
    summary_grid.add_column(style="bright_cyan")

    summary_grid.add_row("Engine Model:", selected_model_folder)
    summary_grid.add_row("Voice Profile:", f"SID {sid} ({speaker_label})")
    summary_grid.add_row("Speech Speed:", f"{current_speed}x")
    summary_grid.add_row("Paragraphs:", f"{len(paragraphs)} paragraph(s)")
    summary_grid.add_row("Save Destination:", output_path)

    console.print(Panel(summary_grid, title="[bold bright_white]Render Pipeline Configuration[/bold bright_white]", border_style="bright_blue", box=box.ROUNDED))

    # Synthesis Execution
    with Progress(
        SpinnerColumn("dots", style="bold bright_cyan"),
        TextColumn("[bold bright_white]{task.description}[/bold bright_white]"),
        BarColumn(bar_width=None, complete_style="bright_cyan", finished_style="bright_green"),
        TaskProgressColumn(),
        console=console
    ) as progress:

        init_task = progress.add_task("Initializing Model...", total=100)

        if is_kokoro_en or is_kokoro_multi:
            lexicon_file = os.path.join(selected_model_path, "lexicon.txt")
            selected_lang = "en-us"
            if is_kokoro_multi:
                if sid in [29, 30, 31]:
                    selected_lang = "hi"
                elif sid in [32, 33, 34, 35, 36]:
                    selected_lang = "ja"

            kokoro_config = sherpa_onnx.OfflineTtsKokoroModelConfig(
                model=os.path.join(selected_model_path, "model.onnx"),
                voices=os.path.join(selected_model_path, "voices.bin"),
                tokens=os.path.join(selected_model_path, "tokens.txt"),
                data_dir=os.path.join(selected_model_path, "espeak-ng-data"),
                lexicon=lexicon_file if os.path.exists(lexicon_file) else "",
                length_scale=1.0,
            )
            if hasattr(kokoro_config, "lang"):
                kokoro_config.lang = selected_lang

            config = sherpa_onnx.OfflineTtsConfig(
                model=sherpa_onnx.OfflineTtsModelConfig(
                    kokoro=kokoro_config,
                    num_threads=DEFAULT_THREADS,
                )
            )
        else:
            onnx_file = next((f for f in os.listdir(selected_model_path) if f.endswith(".onnx")), "model.onnx")
            config = sherpa_onnx.OfflineTtsConfig(
                model=sherner_onnx.OfflineTtsModelConfig(
                    vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                        model=os.path.join(selected_model_path, onnx_file),
                        tokens=os.path.join(selected_model_path, "tokens.txt"),
                        data_dir=os.path.join(selected_model_path, "espeak-ng-data") if os.path.exists(os.path.join(selected_model_path, "espeak-ng-data")) else "",
                    ),
                    num_threads=DEFAULT_THREADS,
                )
            )

        tts = sherpa_onnx.OfflineTts(config)
        progress.update(init_task, completed=100)

        audio_chunks = []
        sample_rate = None

        render_task = progress.add_task("Synthesizing Audio...", total=len(paragraphs))

        for idx, p in enumerate(paragraphs, start=1):
            audio = tts.generate(text=p, sid=sid, speed=current_speed)

            if sample_rate is None:
                sample_rate = audio.sample_rate

            audio_chunks.append(audio.samples)
            silence = np.zeros(int(sample_rate * 0.5), dtype=np.float32)
            audio_chunks.append(silence)

            progress.update(render_task, completed=idx)

        combined_audio = np.concatenate(audio_chunks)
        sf.write(output_path, combined_audio, sample_rate)

    console.print(Panel(
        f"[bold bright_green]✓ GENERATION COMPLETE[/bold bright_green]\\\\n"
        f"[dim]Output file saved directly to:[/dim]\\\\n"
